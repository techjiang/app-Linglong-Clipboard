# CNB 流水线
#
# 注意：PyInstaller 不支持交叉编译，这里只能产出 Linux 二进制。
# Windows / macOS 的产物由 .github/workflows/build.yml 的三平台矩阵负责，
# 三平台产物汇总到 GitHub Release；CNB Release 只挂 Linux 包。

main:
  push:
    - stages:
        - name: 测试
          image: cnbcool/default-npc:latest
          script: |
            apt-get update -qq && apt-get install -y -qq \
              libegl1 libglib2.0-0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
              libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
              binutils libpython3.11
            pip install --quiet -r requirements-dev.txt
            export QT_QPA_PLATFORM=offscreen
            pytest tests/ -q --cov=linglong_clip --cov-report=term

# tag_push 是仓库级事件，与分支无关，必须写在 `$` 兜底分支下。
# 之前挂在 `main:` 下面，打标签时流水线根本不触发，v1.0.0 只能手工补附件。
$:
  tag_push:
    - stages:
        - name: 打包 Linux 可执行文件
          image: cnbcool/default-npc:latest
          script: |
            apt-get update -qq && apt-get install -y -qq \
              libegl1 libglib2.0-0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
              binutils libpython3.11
            # `packaging` extra 带上 Linux 的原生依赖（python-xlib）。
            # 没有它打包照样「成功」，但产物里的全局快捷键与来源识别是死的 ——
            # 使用者只会看到「不可用」，分不清是包的问题还是自己环境的问题。
            pip install --quiet -e ".[packaging]"
            pip install --quiet pytest
            export QT_QPA_PLATFORM=offscreen
            # --require-native：原生依赖缺失时直接失败，不产出功能残缺的包
            python packaging/build.py --require-native
            # 产物必须能启动，否则打出来的只是一个几十 MB 的砖
            ./dist/linglong-clipboard --version
            ./dist/linglong-clipboard --stats
          artifacts:
            - dist/*.tar.gz
            - dist/*.zip

        # artifacts 只是「这次构建的产物」，不挂到版本页就没人能从 Releases 下载。
        # tag 名就是版本号，附件与 GitHub Release 用同一套 ASCII 命名。
        - name: 发布到 CNB Release
          image: cnbcool/default-npc:latest
          script: |
            set -e
            TAG="${CNB_BRANCH}"
            REPO="${CNB_REPO_SLUG}"
            PKG=$(ls dist/*.tar.gz 2>/dev/null | head -1 || find . -name '*.tar.gz' | head -1)
            if [ -z "$PKG" ]; then
              echo "找不到 Linux 发行包，终止发布" >&2
              exit 1
            fi
            echo "发行包：$PKG"

            # Release 可能还没建好（tag 触发的流水线可能先于 Release 创建），重试几次；
            # 拿不到就明确失败，不吞错——否则发布了个空版本页还以为成功了。
            RID=""
            for i in 1 2 3 4 5 6; do
              cnb releases get-release-by-tag --repo "$REPO" --tag "$TAG" > release.out 2>/dev/null || true
              RID=$(python3 tools/release_asset.py rid release.out 2>/dev/null || true)
              [ -n "$RID" ] && break
              echo "等待 $TAG 对应的 Release…（第 $i 次）"
              sleep 10
            done
            [ -n "$RID" ] || { echo "Release $TAG 不存在，终止发布" >&2; exit 1; }

            cnb releases post-release-asset-upload-url --repo "$REPO" --release-id "$RID" \
              --asset-name linglong-clipboard-linux.tar.gz \
              --size "$(stat -c%s "$PKG")" --overwrite > upload.out
            python3 tools/release_asset.py upload upload.out "$PKG" "$REPO" "$RID"
            echo "已发布：Release $TAG"
