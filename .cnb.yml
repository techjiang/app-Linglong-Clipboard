# CNB 流水线：测试三平台矩阵 + 打标签时产出可执行文件
main:
  push:
    - stages:
        - name: 测试
          image: cnbcool/default-npc:latest
          script: |
            pip install --quiet -r requirements-dev.txt
            apt-get update -qq && apt-get install -y -qq \
              libegl1 libglib2.0-0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
            export QT_QPA_PLATFORM=offscreen
            pytest tests/ -q --cov=linglong_clip --cov-report=term

  tag_push:
    - stages:
        - name: 打包 Linux 可执行文件
          image: cnbcool/default-npc:latest
          script: |
            pip install --quiet -r requirements-dev.txt
            apt-get update -qq && apt-get install -y -qq \
              libegl1 libglib2.0-0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
            export QT_QPA_PLATFORM=offscreen
            python packaging/build.py
          artifacts:
            - dist/**
