# CNB 流水线
#
# tag_push 一次出两个平台的包，都挂到同一个版本页：
#   Linux   —— 本机 PyInstaller 直接打
#   Windows —— PyInstaller 不支持交叉编译，但 Wine + Windows 版 Python
#              能提供真实的 Windows 运行时，于是同一台 Linux 构建机就能产出
#              原生 .exe（见 packaging/build_windows_wine.sh）。
# macOS 的 .app 需要 macOS 才能签名/打包，仍由 .github/workflows/build.yml 承担。

main:
  push:
    - stages:
        - name: 测试
          image: cnbcool/default-npc:latest
          script: |
            apt-get update -qq && apt-get install -y -qq \
              libegl1 libglib2.0-0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
              libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
              binutils libpython3.11
            pip install --quiet -r requirements-dev.txt
            export QT_QPA_PLATFORM=offscreen
            pytest tests/ -q --cov=linglong_clip --cov-report=term

# tag_push 是仓库级事件，与分支无关，必须写在 `$` 兜底分支下。
# 之前挂在 `main:` 下面，打标签时流水线根本不触发，v1.0.0 只能手工补附件。
#
# api_trigger 让发布可以重跑：Release 建晚了、或者某一步偶发失败，
# 不必删了标签重打（已挂 Release 的标签远端根本不让删）。
# 用锚点复用同一份 stages，两个事件不会各写一遍然后悄悄走偏。
$:
  tag_push: &release-pipeline
    - stages:
        - name: 打包 Linux 可执行文件
          image: cnbcool/default-npc:latest
          script: |
            apt-get update -qq && apt-get install -y -qq \
              libegl1 libglib2.0-0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
              binutils libpython3.11
            # `packaging` extra 带上 Linux 的原生依赖（python-xlib）。
            # 没有它打包照样「成功」，但产物里的全局快捷键与来源识别是死的 ——
            # 使用者只会看到「不可用」，分不清是包的问题还是自己环境的问题。
            pip install --quiet -e ".[packaging]"
            pip install --quiet pytest
            export QT_QPA_PLATFORM=offscreen
            # --require-native：原生依赖缺失时直接失败，不产出功能残缺的包
            python3 packaging/build.py --require-native
            # 产物必须能启动，否则打出来的只是一个几十 MB 的砖
            ./dist/linglong-clipboard --version
            ./dist/linglong-clipboard --stats
          artifacts:
            - dist/*.tar.gz
            - dist/*.zip

        # 任务之间只有 CNB_BUILD_WORKSPACE（/workspace）共享，dist/ 正好落在里面，
        # Windows 包和上一个 stage 的 Linux 包会在同一个目录里汇合。
        - name: 打包 Windows .exe（Wine）
          image: cnbcool/default-npc:latest
          script: |
            set -e
            apt-get update -qq && apt-get install -y -qq wine
            # Wine 8 在没有终端的环境下会让 Windows 版 Python 起不来，
            # packaging/build_windows_wine.sh 里用 tools/wine_run.py 借 pty 绕过。
            bash packaging/build_windows_wine.sh
          artifacts:
            - dist/*.zip
            - dist/*.exe

        # artifacts 只是「这次构建的产物」，不挂到版本页就没人能从 Releases 下载。
        # tag 名就是版本号，附件与 GitHub Release 用同一套 ASCII 命名。
        - name: 发布到 CNB Release
          image: cnbcool/default-npc:latest
          script: |
            set -e
            # 版本号 = 这次发布对应的 tag。
            # tag_push 下 CNB_BRANCH 就是 tag 名；api_trigger 下它是分支名（main），
            # 只能从事件 URL 尾部（.../releases/tag/v1.0.1）或手动指定的变量里取。
            TAG="${RELEASE_TAG:-}"
            if [ -z "$TAG" ]; then
              case "$CNB_BRANCH" in
                v[0-9]*) TAG="$CNB_BRANCH" ;;
                *) TAG="${CNB_EVENT_URL##*/}" ;;
              esac
            fi
            [ -n "$TAG" ] || { echo "推不出要发布的版本号" >&2; exit 1; }
            echo "版本号：$TAG"
            REPO="${CNB_REPO_SLUG}"

            # 两个平台的包缺一不可：只发一半等于把另一半用户挡在门外。
            LINUX_PKG="dist/linglong-clipboard-linux.tar.gz"
            WIN_PKG="dist/linglong-clipboard-windows.zip"
            for pkg in "$LINUX_PKG" "$WIN_PKG"; do
              [ -f "$pkg" ] || { echo "缺少发行包：$pkg，终止发布" >&2; exit 1; }
              echo "发行包：$pkg ($(stat -c%s "$pkg") bytes)"
            done

            # Release 可能还没建好（tag 触发的流水线可能先于 Release 创建），重试几次；
            # 拿不到就明确失败，不吞错——否则发布了个空版本页还以为成功了。
            RID=""
            for i in 1 2 3 4 5 6; do
              cnb releases get-release-by-tag --repo "$REPO" --tag "$TAG" > release.out 2>/dev/null || true
              RID=$(python3 tools/release_asset.py rid release.out 2>/dev/null || true)
              [ -n "$RID" ] && break
              echo "等待 $TAG 对应的 Release…（第 $i 次）"
              sleep 10
            done
            [ -n "$RID" ] || { echo "Release $TAG 不存在，终止发布" >&2; exit 1; }

            # 逐个上传：每个附件都是「要地址 -> PUT -> 确认」三步，confirm 之前不算数
            for pkg in "$LINUX_PKG" "$WIN_PKG"; do
              name=$(basename "$pkg")
              echo "上传 $name"
              cnb releases post-release-asset-upload-url --repo "$REPO" --release-id "$RID" \
                --asset-name "$name" --size "$(stat -c%s "$pkg")" --overwrite > upload.out
              python3 tools/release_asset.py upload upload.out "$pkg" "$REPO" "$RID"
            done
            echo "已发布：Release $TAG（Linux + Windows）"

  # 手动重跑发布：cnb build start-build --tag <tag> --event api_trigger
  api_trigger: *release-pipeline
