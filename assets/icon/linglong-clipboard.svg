<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0e1320"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6aa4ff"/>
      <stop offset="1" stop-color="#4c8dff"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 圆角底板：托盘和任务栏里也认得出这是一张「卡片」而不是随便一团色块 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#2c3a58" stroke-width="4"/>

  <!-- 后面那张卡：表示「历史里还有很多条」 -->
  <rect x="176" y="112" width="240" height="300" rx="40" fill="#7fb0ff" opacity="0.55"/>

  <!-- 前面那张卡 -->
  <rect x="104" y="168" width="272" height="288" rx="44" fill="url(#front)" filter="url(#sh)"/>

  <!-- 卡片上的三条文字，长度递减：读起来像一段被复制的内容 -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-width="22">
    <line x1="152" y1="248" x2="330" y2="248"/>
    <line x1="152" y1="312" x2="330" y2="312"/>
    <line x1="152" y1="376" x2="264" y2="376"/>
  </g>

  <!-- 右下角放大镜：图标自己说明「这不只是列表，是能搜的」 -->
  <g transform="translate(330 330)">
    <circle cx="46" cy="46" r="52" fill="#0e1320" opacity="0.92"/>
    <circle cx="44" cy="44" r="34" fill="none" stroke="#ffffff" stroke-width="16"/>
    <line x1="68" y1="68" x2="98" y2="98" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
