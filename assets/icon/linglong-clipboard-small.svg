<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 16~32px 专用的简化母版：去掉放大镜与底板，
       小尺寸下这些细节只会糊成一团灰点。
       这里只留「两张卡片 + 三条线」，靠形状轮廓在托盘里被认出来。 -->
  <rect x="24" y="6" width="30" height="38" rx="6" fill="#7fb0ff" opacity="0.55"/>
  <rect x="10" y="14" width="34" height="40" rx="7" fill="#4c8dff"/>
  <g stroke="#ffffff" stroke-linecap="round" stroke-width="4.5">
    <line x1="17" y1="26" x2="37" y2="26"/>
    <line x1="17" y1="34" x2="37" y2="34"/>
    <line x1="17" y1="42" x2="30" y2="42"/>
  </g>
</svg>
