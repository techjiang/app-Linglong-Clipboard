name: 构建与测试

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 测试（${{ matrix.os }} / Python ${{ matrix.python }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 安装 Linux 图形库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libglib2.0-0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0
          # 无头环境跑 Qt 需要 offscreen 平台插件
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      # 测试本身不依赖 OCR：涉及 tesseract 的用例一律走桩后端，
      # 只有少数几条探测「本机装没装」的路径需要真实存在。
      # 装上它是为了让那几条走真分支，而不是被跳过 —— Windows / macOS
      # 上没有这么省事的包管理器，那两条用例在那里会走「未安装」分支，
      # 这本身也是必须被覆盖的真实场景，所以不必强求三平台都装。
      - name: 安装 tesseract（可选，覆盖真机分支）
        if: runner.os == 'Linux'
        run: sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim || true

      - name: 运行测试
        run: pytest tests/ --cov=linglong_clip --cov-report=xml --cov-report=term

      - name: 上传覆盖率
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  package:
    name: 打包（${{ matrix.os }}）
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: 玲珑剪切板-windows
            release: linglong-clipboard-windows.zip
          - os: ubuntu-latest
            artifact: 玲珑剪切板-linux
            release: linglong-clipboard-linux.tar.gz
          - os: macos-latest
            artifact: 玲珑剪切板-macos
            release: linglong-clipboard-macos.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        # `packaging` extra 里带了各平台的原生依赖（Linux 的 python-xlib、
        # macOS 的 pyobjc），缺了它们打出来的包会少一整块功能，
        # 而使用者只会看到「全局快捷键不可用」，不知道是包的问题。
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[packaging]"
          pip install pytest

      - name: 安装 Linux 图形库与打包依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # binutils 提供 objdump（PyInstaller 在 Linux 上打包必需）；
          # libpython 让 PyInstaller 找得到 libpython3.x.so，否则直接报错退出。
          sudo apt-get install -y \
            libegl1 libglib2.0-0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 binutils libpython3.12
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      - name: 打包
        # --require-native：原生依赖缺失时直接失败。
        # 否则 PyInstaller 照样退出 0，产出一个「能启动但少功能」的包。
        run: python packaging/build.py --require-native

      - name: 冒烟测试（产物必须能启动）
        # 三平台都跑：打包成功不等于能运行。入口写错、Qt 插件缺失这类问题
        # 只在真正执行时才暴露，而 CI 绿着，直到用户双击才发现。
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "${{ runner.os }}" in
            Windows) BIN="dist/玲珑剪切板.exe" ;;
            macOS)   BIN="dist/玲珑剪切板.app/Contents/MacOS/玲珑剪切板" ;;
            *)       BIN="dist/linglong-clipboard" ;;
          esac
          echo "产物：$BIN"
          ls -la "$BIN" || dir dist
          "$BIN" --version
          "$BIN" --stats

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

      # 打标签时把三平台产物汇总到同一个 GitHub Release。
      # action 默认给附件加 `..` 前缀（如 `玲珑剪切板-windows..linger`），
      # 下载后文件名不可预测；用 files 显式改写成 ASCII 名称，
      # 与 CNB Release 的附件命名保持一致。
      - name: 上传到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip=>${{ matrix.release }}
            dist/*.tar.gz=>${{ matrix.release }}
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
