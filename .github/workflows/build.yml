name: 构建与测试

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 测试（${{ matrix.os }} / Python ${{ matrix.python }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 安装 Linux 图形库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libglib2.0-0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0
          # 无头环境跑 Qt 需要 offscreen 平台插件
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      - name: 运行测试
        run: pytest tests/ --cov=linglong_clip --cov-report=xml --cov-report=term

      - name: 上传覆盖率
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  package:
    name: 打包（${{ matrix.os }}）
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: 玲珑剪切板-windows
            release: linglong-clipboard-windows.zip
          - os: ubuntu-latest
            artifact: 玲珑剪切板-linux
            release: linglong-clipboard-linux.tar.gz
          - os: macos-latest
            artifact: 玲珑剪切板-macos
            release: linglong-clipboard-macos.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install cryptography pyyaml

      - name: 安装 Linux 图形库与打包依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # binutils 提供 objdump（PyInstaller 在 Linux 上打包必需）；
          # libpython 让 PyInstaller 找得到 libpython3.x.so，否则直接报错退出。
          sudo apt-get install -y \
            libegl1 libglib2.0-0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 binutils libpython3.12
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      - name: 打包
        run: python packaging/build.py

      - name: 冒烟测试（产物必须能启动）
        if: runner.os == 'Linux'
        run: |
          ./dist/linglong-clipboard --version
          ./dist/linglong-clipboard --list
          ./dist/linglong-clipboard --stats
        shell: bash

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

      # 打标签时把三平台产物汇总到同一个 GitHub Release。
      # action 默认给附件加 `..` 前缀（如 `玲珑剪切板-windows..linger`），
      # 下载后文件名不可预测；用 files 显式改写成 ASCII 名称，
      # 与 CNB Release 的附件命名保持一致。
      - name: 上传到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip=>${{ matrix.release }}
            dist/*.tar.gz=>${{ matrix.release }}
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
